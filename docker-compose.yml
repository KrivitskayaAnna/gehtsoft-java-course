version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: user-application
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SERVER_PORT=8080
    restart: unless-stopped
